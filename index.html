<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SlipTracker - บันทึกรายจ่ายจากสลิป</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>body{font-family:'Prompt',sans-serif;background:#f8fafc}</style>

</head>

<body class="text-slate-800 min-h-screen">

<header class="bg-white shadow-sm sticky top-0 z-40">

  <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">

    <h1 class="text-lg font-bold">🧾 SlipTracker</h1>

    <button id="settingsBtn" class="p-2 rounded-full hover:bg-slate-100">⚙️</button>

  </div>

  <div id="settings" class="hidden border-t bg-slate-50">

    <div class="max-w-3xl mx-auto px-4 py-4 space-y-3 text-sm">

      <div><label class="text-xs font-semibold text-slate-500">Google Apps Script URL</label>

        <input id="sheetUrl" class="w-full border rounded-lg p-2 mt-1" placeholder="https://script.google.com/macros/s/.../exec"></div>

      <div><label class="text-xs font-semibold text-slate-500">Gemini API Key</label>

        <input id="apiKey" type="password" class="w-full border rounded-lg p-2 mt-1" placeholder="AIzaSy...">

        <button id="testKey" class="text-xs text-indigo-600 mt-1">ทดสอบ Key</button></div>

      <div class="border-t pt-3">

        <label class="text-xs font-semibold text-slate-500">⏰ เตือนให้อัปโหลดทุกวัน</label>

        <div class="flex gap-2 mt-1 items-center">

          <input id="remTime" type="time" value="21:00" class="border rounded-lg p-2">

          <button id="icsBtn" class="bg-indigo-600 text-white rounded-lg px-3 py-2">เพิ่มลงปฏิทินมือถือ</button>

          <button id="notiBtn" class="border rounded-lg px-3 py-2">เตือนในเบราว์เซอร์</button>

        </div>

        <p class="text-xs text-slate-400 mt-1">ปุ่มปฏิทินจะดาวน์โหลดไฟล์ .ics ที่ตั้งเตือนซ้ำทุกวัน เปิดแล้วกดเพิ่มได้เลย (เตือนได้แม้ไม่ได้เปิดเว็บ)</p>

      </div>

      <button id="csvBtn" class="border rounded-lg px-3 py-2">⬇️ ส่งออก CSV</button>

    </div>

  </div>

</header>



<main class="max-w-3xl mx-auto px-4 py-5 space-y-4 pb-24">

  <div id="banner" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm flex items-center justify-between gap-2">

    <span>📌 วันนี้ยังไม่ได้อัปโหลดสลิปเลย</span>

    <span class="flex gap-2 shrink-0">

      <button onclick="fileInput.click()" class="bg-amber-500 text-white rounded-lg px-3 py-1">อัปโหลด</button>

      <button onclick="skipToday()" class="border border-amber-300 rounded-lg px-3 py-1">วันนี้ไม่มีจ่าย</button>

    </span>

  </div>



  <div class="flex items-center justify-between">

    <select id="month" class="border rounded-lg p-2 text-sm bg-white"></select>

    <span class="text-xs text-slate-500">🔥 บันทึกต่อเนื่อง <b id="streak">0</b> วัน</span>

  </div>



  <div class="grid grid-cols-2 gap-3">

    <div class="bg-indigo-600 text-white rounded-2xl p-5">

      <p class="text-indigo-100 text-sm">รายจ่ายเดือนนี้</p>

      <h2 class="text-2xl font-bold">฿<span id="total">0.00</span></h2>

      <p class="text-xs text-indigo-200 mt-1" id="count"></p>

    </div>

    <div class="bg-white border rounded-2xl p-3 text-center cursor-pointer hover:border-indigo-300" onclick="fileInput.click()">

      <div class="text-2xl">☁️</div>

      <p class="text-sm font-semibold">อัปโหลดสลิป</p>

      <p class="text-xs text-slate-400">แตะ / วางรูป (Ctrl+V)</p>

      <input id="fileInput" type="file" accept="image/*" multiple class="hidden">

    </div>

  </div>



  <div id="status" class="hidden bg-white border border-indigo-100 rounded-xl p-3 text-sm"></div>



  <div class="bg-white border rounded-2xl p-4">

    <div class="flex justify-between mb-2">

      <h3 class="text-sm font-bold">สรุปข้อมูล</h3>

      <select id="period" class="text-xs border rounded-lg p-1 bg-slate-50">

        <option value="d">รายวัน (เดือนที่เลือก)</option><option value="m">รายเดือน</option><option value="y">รายปี</option>

      </select>

    </div>

    <div class="h-48"><canvas id="chart"></canvas></div>

  </div>



  <div class="flex justify-between items-center">

    <h3 class="text-lg font-bold">รายการ</h3>

    <button onclick="openForm()" class="text-sm bg-slate-800 text-white rounded-lg px-3 py-1.5">+ เพิ่มเอง</button>

  </div>

  <div id="list" class="space-y-2"></div>

</main>



<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-4">

  <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 text-sm">

    <h3 class="font-bold" id="mTitle">แก้ไขรายการ</h3>

    <input id="fDate" type="date" class="w-full border rounded-lg p-2">

    <input id="fTime" type="time" class="w-full border rounded-lg p-2">

    <input id="fAmount" type="number" step="0.01" placeholder="จำนวนเงิน" class="w-full border rounded-lg p-2">

    <input id="fReceiver" placeholder="ผู้รับ / ร้านค้า" class="w-full border rounded-lg p-2">

    <input id="fBank" placeholder="ธนาคาร (ไม่บังคับ)" class="w-full border rounded-lg p-2">

    <div class="flex gap-2 justify-end">

      <button onclick="closeForm()" class="px-4 py-2 border rounded-lg">ยกเลิก</button>

      <button onclick="saveForm()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">บันทึก</button>

    </div>

  </div>

</div>



<script>

const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

const thMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

const thDate = iso => { const [y,m,d] = iso.split('-'); return `${+d} ${thMonths[m-1]} ${String(+y+543).slice(2)}`; };

const fmt = n => Number(n).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});



// ---- state (ย้ายข้อมูลเก่า DD/MM/YYYY -> YYYY-MM-DD อัตโนมัติ) ----

const normDate = s => {

  if (!s) return '';

  let m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

  let y, mo, d;

  if (m) { [d, mo, y] = [m[1], m[2], +m[3]]; }

  else if ((m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { [y, mo, d] = [+m[1], m[2], m[3]]; }

  else return '';

  if (y > 2400) y -= 543;

  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

};

let txs = load('slipTracker_txs', []).map(t => ({...t, date: normDate(t.date), added: t.added || (t.timestamp||'').slice(0,10)}));

let apiKey = load('slipTracker_apiKey', '') ;

let sheetUrl = load('slipTracker_sheetUrl', '');

let skipDays = load('slipTracker_skip', []);

// รองรับค่าเดิมที่เก็บเป็น string ธรรมดา

if (typeof apiKey !== 'string') apiKey = '';

if (typeof sheetUrl !== 'string') sheetUrl = '';

let chart = null, editId = null;

const rawGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };

if (!apiKey) apiKey = rawGet('slipTracker_apiKey');

if (!sheetUrl) sheetUrl = rawGet('slipTracker_sheetUrl');

const saveAll = () => save('slipTracker_txs', txs);

const saveSetting = (k, v) => { try { localStorage.setItem(k, v); } catch {} };



$('apiKey').value = apiKey; $('sheetUrl').value = sheetUrl;

$('settingsBtn').onclick = () => $('settings').classList.toggle('hidden');

$('sheetUrl').oninput = e => { sheetUrl = e.target.value.trim(); saveSetting('slipTracker_sheetUrl', sheetUrl); };

$('apiKey').oninput = e => { apiKey = e.target.value.trim(); saveSetting('slipTracker_apiKey', apiKey); };



// ---- Gemini ----

const MODEL = 'gemini-2.5-flash';

const gem = body => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`, {

  method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r => r.json());



$('testKey').onclick = async () => {

  if (!apiKey) return alert('กรุณาใส่ API Key ก่อน');

  const r = await gem({contents:[{parts:[{text:'Hello'}]}]});

  alert(r.error ? '❌ ' + r.error.message : '✅ API Key ใช้งานได้');

};



// ย่อรูปเหลือด้านยาว 1200px

function compress(file) {

  return new Promise((res, rej) => {

    const img = new Image(), url = URL.createObjectURL(file);

    img.onload = () => {

      const s = Math.min(1, 1200 / Math.max(img.width, img.height));

      const c = document.createElement('canvas');

      c.width = img.width * s; c.height = img.height * s;

      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

      URL.revokeObjectURL(url);

      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);

    };

    img.onerror = () => rej(new Error('เปิดรูปไม่ได้'));

    img.src = url;

  });

}



async function readSlip(file) {

  const data = await compress(file);

  const prompt = `วิเคราะห์สลิปโอนเงินนี้ ตอบเป็น JSON เท่านั้น:

{"date":"YYYY-MM-DD (แปลงปี พ.ศ. เป็น ค.ศ. เสมอ)","time":"HH:MM","amount":ตัวเลขไม่มีลูกน้ำ,"receiver":"ชื่อผู้รับหรือร้านค้า","bank":"ธนาคารปลายทาง","ref":"เลขที่รายการ/Ref ถ้ามี ไม่มีให้เป็นสตริงว่าง"}`;

  const r = await gem({

    contents:[{parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg', data}}]}],

    generationConfig:{temperature:0.1, responseMimeType:'application/json'}});

  if (r.error) throw new Error(r.error.message);

  let j;

  try { j = JSON.parse(r.candidates[0].content.parts[0].text); } catch { throw new Error('AI ตอบผิดรูปแบบ'); }

  j.date = normDate(j.date); j.amount = Number(j.amount);

  if (!j.date || !Number.isFinite(j.amount)) throw new Error('อ่านวันที่/จำนวนเงินไม่ได้');

  return j;

}



const isDup = s => txs.some(t => (s.ref && t.ref === s.ref) ||

  (t.date === s.date && t.time === s.time && Number(t.amount) === s.amount && t.receiver === s.receiver));



function sync(t) {

  if (!sheetUrl) return;

  fetch(sheetUrl, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},

    body: JSON.stringify({id:t.id, date:t.date, time:t.time, amount:t.amount, receiver:t.receiver, bank:t.bank})}).catch(() => {});

}



// ---- upload ----

const fileInput = $('fileInput');

fileInput.onchange = e => handleFiles([...e.target.files]).then(() => fileInput.value = '');

document.addEventListener('paste', e => {

  const fs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));

  if (fs.length) handleFiles(fs);

});



async function handleFiles(files) {

  if (!files.length) return;

  if (!apiKey) { alert('กรุณาใส่ Gemini API Key ในตั้งค่าก่อน'); $('settings').classList.remove('hidden'); return; }

  const st = $('status'); st.classList.remove('hidden');

  let ok = 0, dup = 0; const fails = [];

  for (let i = 0; i < files.length; i++) {

    st.textContent = `⏳ กำลังอ่านสลิป ${i+1}/${files.length}...`;

    try {

      const s = await readSlip(files[i]);

      if (isDup(s)) { dup++; continue; }

      const t = {id: Date.now() + '-' + i, date:s.date, time:s.time || '', amount:s.amount,

                 receiver:s.receiver || '', bank:s.bank || '', ref:s.ref || '', added: todayISO()};

      txs.push(t); saveAll(); sync(t); ok++;

    } catch (err) { fails.push(`รูปที่ ${i+1}: ${err.message}`); }

  }

  render();

  st.textContent = `✅ สำเร็จ ${ok} • ซ้ำ ${dup} • ล้มเหลว ${fails.length}` + (fails.length ? '\n' + fails.join(' | ') : '');

  setTimeout(() => st.classList.add('hidden'), fails.length ? 8000 : 3500);

}



// ---- add / edit ----

function openForm(id) {

  editId = id || null;

  const t = txs.find(x => x.id === id) || {date: todayISO(), time:'', amount:'', receiver:'', bank:''};

  $('mTitle').textContent = id ? 'แก้ไขรายการ' : 'เพิ่มรายจ่าย';

  $('fDate').value = t.date; $('fTime').value = t.time; $('fAmount').value = t.amount;

  $('fReceiver').value = t.receiver; $('fBank').value = t.bank;

  $('modal').classList.remove('hidden');

}

function closeForm() { $('modal').classList.add('hidden'); }

function saveForm() {

  const amount = Number($('fAmount').value);

  if (!$('fDate').value || !Number.isFinite(amount) || amount <= 0) return alert('กรอกวันที่และจำนวนเงินให้ถูกต้อง');

  const v = {date:$('fDate').value, time:$('fTime').value, amount, receiver:$('fReceiver').value.trim(), bank:$('fBank').value.trim()};

  if (editId) Object.assign(txs.find(x => x.id === editId), v);

  else { const t = {id: Date.now()+'', ref:'', added: todayISO(), ...v}; txs.push(t); sync(t); }

  saveAll(); closeForm(); render();

}

function del(id) { if (confirm('ลบรายการนี้?')) { txs = txs.filter(t => t.id !== id); saveAll(); render(); } }



// ---- reminders ----

function skipToday() { skipDays.push(todayISO()); save('slipTracker_skip', skipDays); render(); }

function recordedDays() { return new Set([...txs.map(t => t.added).filter(Boolean), ...skipDays]); }

function streak() {

  const days = recordedDays(); let n = 0; const d = new Date();

  if (!days.has(todayISO())) d.setDate(d.getDate() - 1);

  for (;;) {

    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

    if (!days.has(k)) break; n++; d.setDate(d.getDate() - 1);

  }

  return n;

}

$('icsBtn').onclick = () => {

  const [h, m] = ($('remTime').value || '21:00').split(':');

  const d = new Date(); const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;

  const url = location.protocol.startsWith('http') ? location.href : '';

  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SlipTracker//TH','BEGIN:VEVENT',

    `UID:sliptracker-daily@local`, `DTSTAMP:${ds}T000000Z`, `DTSTART:${ds}T${h}${m}00`, 'DURATION:PT10M',

    'RRULE:FREQ=DAILY','SUMMARY:อัปโหลดสลิปรายจ่ายวันนี้', url ? `DESCRIPTION:${url}` : 'DESCRIPTION:เปิดแอป SlipTracker แล้วอัปโหลดสลิป',

    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:อัปโหลดสลิปรายจ่ายวันนี้','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');

  const a = document.createElement('a');

  a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));

  a.download = 'sliptracker-reminder.ics'; a.click();

};

$('notiBtn').onclick = async () => {

  if (!('Notification' in window)) return alert('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน');

  if (await Notification.requestPermission() !== 'granted') return;

  saveSetting('slipTracker_noti', $('remTime').value);

  alert('ตั้งแล้ว: จะเตือนตอนเปิดหน้านี้ค้างไว้ตามเวลาที่เลือก');

};

setInterval(() => {

  const t = rawGet('slipTracker_noti'); if (!t || Notification.permission !== 'granted') return;

  const n = new Date(), hm = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;

  if (hm === t && !recordedDays().has(todayISO()) && rawGet('slipTracker_notiSent') !== todayISO()) {

    saveSetting('slipTracker_notiSent', todayISO()); new Notification('SlipTracker', {body:'วันนี้ยังไม่ได้อัปโหลดสลิป'});

  }

}, 30000);



$('csvBtn').onclick = () => {

  const rows = [['วันที่','เวลา','จำนวนเงิน','ผู้รับ','ธนาคาร'], ...[...txs].sort((a,b)=>a.date.localeCompare(b.date)).map(t => [t.date,t.time,t.amount,t.receiver,t.bank])];

  const csv = '\ufeff' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));

  a.download = 'expenses.csv'; a.click();

};



// ---- render ----

$('month').onchange = render; $('period').onchange = render;

function render() {

  // เดือนที่เลือก

  const months = [...new Set([todayISO().slice(0,7), ...txs.map(t => t.date.slice(0,7))])].sort().reverse();

  const cur = $('month').value || months[0];

  $('month').innerHTML = months.map(m => { const [y, mo] = m.split('-'); return `<option value="${m}" ${m===cur?'selected':''}>${thMonths[mo-1]} ${+y+543}</option>`; }).join('');

  const sel = $('month').value;

  const inMonth = txs.filter(t => t.date.startsWith(sel)).sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));



  $('total').textContent = fmt(inMonth.reduce((s,t) => s + (Number(t.amount)||0), 0));

  $('count').textContent = `${inMonth.length} รายการ`;

  $('streak').textContent = streak();

  $('banner').classList.toggle('hidden', recordedDays().has(todayISO()));



  $('list').innerHTML = inMonth.length ? inMonth.map(t => `

    <div class="bg-white border rounded-xl p-3 flex items-center justify-between gap-2">

      <div class="min-w-0">

        <div class="font-semibold text-sm truncate">${esc(t.receiver) || 'ไม่ระบุชื่อ'}</div>

        <div class="text-xs text-slate-500">${thDate(t.date)} ${esc(t.time)} ${t.bank ? `<span class="bg-slate-100 px-1.5 rounded">${esc(t.bank)}</span>` : ''}</div>

      </div>

      <div class="flex items-center gap-2 shrink-0">

        <b>฿${fmt(t.amount)}</b>

        <button onclick="openForm('${esc(t.id)}')" class="text-slate-400 hover:text-indigo-600">✏️</button>

        <button onclick="del('${esc(t.id)}')" class="text-slate-400 hover:text-red-500">🗑️</button>

      </div>

    </div>`).join('') : '<div class="text-center py-8 text-slate-400 border border-dashed rounded-xl bg-white">ยังไม่มีรายการในเดือนนี้</div>';



  // chart

  const p = $('period').value, agg = {};

  (p === 'd' ? inMonth : txs).forEach(t => {

    const k = p === 'd' ? t.date : p === 'm' ? t.date.slice(0,7) : t.date.slice(0,4);

    agg[k] = (agg[k] || 0) + (Number(t.amount) || 0);

  });

  const keys = Object.keys(agg).sort();

  const label = k => { const a = k.split('-'); return a.length === 3 ? `${+a[2]} ${thMonths[a[1]-1]}` : a.length === 2 ? `${thMonths[a[1]-1]} ${String(+a[0]+543).slice(2)}` : `${+a[0]+543}`; };

  if (chart) chart.destroy();

  chart = new Chart($('chart'), {type:'bar',

    data:{labels:keys.map(label), datasets:[{data:keys.map(k => agg[k]), backgroundColor:'rgba(79,70,229,.8)', borderRadius:4}]},

    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}});

}

render();

</script>

</body>

</html>
