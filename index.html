<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlipTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>body{font-family:'Prompt',sans-serif;background:#f8fafc}</style>
</head>
<body class="text-slate-800 min-h-screen">
<header class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-lg font-bold">🧾 SlipTracker</h1>
    <div class="flex items-center gap-2">
      <span id="badge" class="text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-600">ยังไม่ได้ตั้งค่า</span>
      <button id="refresh" class="p-2 rounded-full hover:bg-slate-100" title="รีเฟรช">🔄</button>
      <button id="settingsBtn" class="p-2 rounded-full hover:bg-slate-100">⚙️</button>
    </div>
  </div>
  <div id="settings" class="hidden border-t bg-slate-50">
    <div class="max-w-3xl mx-auto px-4 py-4 space-y-3 text-sm">
      <div><label class="text-xs font-semibold text-slate-500">Apps Script URL (ลงท้าย /exec)</label>
        <input id="url" class="w-full border rounded-lg p-2 mt-1" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div><label class="text-xs font-semibold text-slate-500">TOKEN (ตรงกับที่ตั้งใน Script Properties)</label>
        <input id="token" type="password" class="w-full border rounded-lg p-2 mt-1"></div>
      <button id="csvBtn" class="border rounded-lg px-3 py-2">⬇️ ส่งออก CSV</button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-5 space-y-4 pb-24">
  <div class="flex items-center justify-between">
    <select id="month" class="border rounded-lg p-2 text-sm bg-white"></select>
    <div class="flex gap-2">
      <button onclick="openForm()" class="text-sm bg-slate-800 text-white rounded-lg px-3 py-1.5">+ เพิ่มเอง</button>
      <button onclick="fileInput.click()" class="text-sm border rounded-lg px-3 py-1.5 bg-white">☁️ อัปโหลดสลิป</button>
      <input id="fileInput" type="file" accept="image/*" multiple class="hidden">
    </div>
  </div>

  <div class="bg-indigo-600 text-white rounded-2xl p-5">
    <p class="text-indigo-100 text-sm">รายจ่ายเดือนที่เลือก</p>
    <h2 class="text-2xl font-bold">฿<span id="total">0.00</span></h2>
    <p class="text-xs text-indigo-200 mt-1" id="count"></p>
  </div>

  <div id="status" class="hidden bg-white border border-indigo-100 rounded-xl p-3 text-sm"></div>

  <div class="bg-white border rounded-2xl p-4">
    <div class="flex justify-between mb-2">
      <h3 class="text-sm font-bold">สรุปข้อมูล</h3>
      <select id="period" class="text-xs border rounded-lg p-1 bg-slate-50">
        <option value="d">รายวัน (เดือนที่เลือก)</option><option value="m">รายเดือน</option><option value="y">รายปี</option>
      </select>
    </div>
    <div class="h-48"><canvas id="chart"></canvas></div>
  </div>

  <div id="list" class="space-y-2"></div>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 text-sm">
    <h3 class="font-bold" id="mTitle"></h3>
    <input id="fDate" type="date" class="w-full border rounded-lg p-2">
    <input id="fTime" type="time" class="w-full border rounded-lg p-2">
    <input id="fAmount" type="number" step="0.01" placeholder="จำนวนเงิน" class="w-full border rounded-lg p-2">
    <input id="fReceiver" placeholder="ผู้รับ / ร้านค้า" class="w-full border rounded-lg p-2">
    <input id="fBank" placeholder="ธนาคาร (ไม่บังคับ)" class="w-full border rounded-lg p-2">
    <div class="flex gap-2 justify-end">
      <button onclick="closeForm()" class="px-4 py-2 border rounded-lg">ยกเลิก</button>
      <button id="saveBtn" onclick="saveForm()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">บันทึก</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const setLs = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const p2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; };
const thM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate = iso => { const [y,m,d] = iso.split('-'); return `${+d} ${thM[m-1]} ${String(+y+543).slice(2)}`; };
const fmt = n => Number(n).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});

let url = ls('st_url'), token = ls('st_token'), txs = [], chart = null, editId = null;
$('url').value = url; $('token').value = token;
$('settingsBtn').onclick = () => $('settings').classList.toggle('hidden');
$('url').oninput = e => { url = e.target.value.trim(); setLs('st_url', url); };
$('token').oninput = e => { token = e.target.value.trim(); setLs('st_token', token); };
$('refresh').onclick = load;
$('month').onchange = render; $('period').onchange = render;

function badge(text, color) {
  const c = {gray:'bg-slate-100 text-slate-600', green:'bg-green-100 text-green-700', red:'bg-red-100 text-red-700', blue:'bg-blue-100 text-blue-700'}[color || 'gray'];
  $('badge').className = 'text-xs px-2 py-1 rounded-full ' + c; $('badge').textContent = text;
}
function say(text, ms) { const s = $('status'); s.textContent = text; s.classList.remove('hidden'); if (ms) setTimeout(() => s.classList.add('hidden'), ms); }

// ---------- API ----------
async function load() {
  if (!url) { badge('ยังไม่ได้ตั้งค่า'); $('settings').classList.remove('hidden'); return render(); }
  badge('กำลังโหลด...', 'blue');
  try {
    const d = await (await fetch(url + '?token=' + encodeURIComponent(token))).json();
    if (!Array.isArray(d)) throw new Error(d.message || 'ข้อมูลผิดรูปแบบ');
    txs = d.map(t => ({...t, date: String(t.date).slice(0, 10), amount: Number(t.amount)}))
           .filter(t => /^\d{4}-\d{2}-\d{2}$/.test(t.date) && Number.isFinite(t.amount));
    const n = new Date(); badge(`ซิงก์ ${p2(n.getHours())}:${p2(n.getMinutes())}`, 'green');
  } catch (e) { badge('เชื่อมต่อล้มเหลว', 'red'); say('❌ ' + e.message, 6000); }
  render();
}
async function post(o) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({token, ...o})});
  const j = await r.json();
  if (j.status !== 'success') throw new Error(j.message || 'ไม่สำเร็จ');
  return j;
}

// ---------- upload (สำรอง: ปกติสลิปเข้าผ่าน Drive อัตโนมัติ) ----------
fileInput.onchange = async e => { await handleFiles([...e.target.files]); fileInput.value = ''; };
document.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])].filter(x => x.type.startsWith('image/')); if (f.length) handleFiles(f); });
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('เปิดรูปไม่ได้')); img.src = u;
  });
}
async function handleFiles(files) {
  if (!files.length) return;
  if (!url) { alert('กรุณาตั้งค่า URL ก่อน'); return; }
  let ok = 0, dup = 0; const fails = [];
  for (let i = 0; i < files.length; i++) {
    say(`⏳ ส่งสลิป ${i+1}/${files.length}...`);
    try {
      const r = (await post({action:'upload', image: await compress(files[i]), mime:'image/jpeg'})).result;
      r.added ? ok++ : (r.processed ? dup++ : fails.push(i + 1));
    } catch (e) { fails.push(`${i+1} (${e.message})`); }
  }
  say(`✅ เพิ่ม ${ok} • ซ้ำ ${dup} • ล้มเหลว ${fails.length}` + (fails.length ? ' → ' + fails.join(', ') : ''), 8000);
  load();
}

// ---------- add / edit / delete ----------
function openForm(id) {
  editId = id || null;
  const t = txs.find(x => x.id === id) || {date: todayISO(), time:'', amount:'', receiver:'', bank:''};
  $('mTitle').textContent = id ? 'แก้ไขรายการ' : 'เพิ่มรายจ่าย';
  $('fDate').value = t.date; $('fTime').value = t.time; $('fAmount').value = t.amount;
  $('fReceiver').value = t.receiver; $('fBank').value = t.bank;
  $('modal').classList.remove('hidden');
}
function closeForm() { $('modal').classList.add('hidden'); }
async function saveForm() {
  const amount = Number($('fAmount').value);
  if (!url) return alert('กรุณาตั้งค่า URL ก่อน');
  if (!$('fDate').value || !(amount > 0)) return alert('กรอกวันที่และจำนวนเงินให้ถูกต้อง');
  const v = {date:$('fDate').value, time:$('fTime').value, amount, receiver:$('fReceiver').value.trim(), bank:$('fBank').value.trim()};
  $('saveBtn').disabled = true;
  try { await post(editId ? {action:'update', id:editId, ...v} : {action:'add', ...v}); closeForm(); await load(); }
  catch (e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
  $('saveBtn').disabled = false;
}
async function del(id) {
  if (!confirm('ลบรายการนี้ออกจากชีต?')) return;
  try { await post({action:'delete', id}); load(); } catch (e) { alert('ลบไม่สำเร็จ: ' + e.message); }
}

$('csvBtn').onclick = () => {
  const rows = [['วันที่','เวลา','จำนวนเงิน','ผู้รับ','ธนาคาร'], ...[...txs].sort((a,b) => a.date.localeCompare(b.date)).map(t => [t.date,t.time,t.amount,t.receiver,t.bank])];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(',')).join('\n')], {type:'text/csv'}));
  a.download = 'expenses.csv'; a.click();
};

// ---------- render ----------
function render() {
  const months = [...new Set([todayISO().slice(0,7), ...txs.map(t => t.date.slice(0,7))])].sort().reverse();
  const cur = $('month').value || months[0];
  $('month').innerHTML = months.map(m => { const [y, mo] = m.split('-'); return `<option value="${m}" ${m===cur?'selected':''}>${thM[mo-1]} ${+y+543}</option>`; }).join('');
  const sel = $('month').value;
  const inMonth = txs.filter(t => t.date.startsWith(sel)).sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time));
  $('total').textContent = fmt(inMonth.reduce((s,t) => s + t.amount, 0));
  $('count').textContent = `${inMonth.length} รายการ`;

  $('list').innerHTML = inMonth.length ? inMonth.map(t => `
    <div class="bg-white border rounded-xl p-3 flex items-center justify-between gap-2">
      <div class="min-w-0">
        <div class="font-semibold text-sm truncate">${esc(t.receiver) || 'ไม่ระบุชื่อ'}</div>
        <div class="text-xs text-slate-500">${thDate(t.date)} ${esc(t.time)} ${t.bank ? `<span class="bg-slate-100 px-1.5 rounded">${esc(t.bank)}</span>` : ''}</div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <b>฿${fmt(t.amount)}</b>
        <button onclick="openForm('${esc(t.id)}')" class="text-slate-400 hover:text-indigo-600">✏️</button>
        <button onclick="del('${esc(t.id)}')" class="text-slate-400 hover:text-red-500">🗑️</button>
      </div>
    </div>`).join('') : '<div class="text-center py-8 text-slate-400 border border-dashed rounded-xl bg-white">ยังไม่มีรายการในเดือนนี้</div>';

  const p = $('period').value, agg = {};
  (p === 'd' ? inMonth : txs).forEach(t => { const k = p === 'd' ? t.date : p === 'm' ? t.date.slice(0,7) : t.date.slice(0,4); agg[k] = (agg[k] || 0) + t.amount; });
  const keys = Object.keys(agg).sort();
  const label = k => { const a = k.split('-'); return a.length === 3 ? `${+a[2]} ${thM[a[1]-1]}` : a.length === 2 ? `${thM[a[1]-1]} ${String(+a[0]+543).slice(2)}` : `${+a[0]+543}`; };
  if (chart) chart.destroy();
  chart = new Chart($('chart'), {type:'bar',
    data:{labels:keys.map(label), datasets:[{data:keys.map(k => agg[k]), backgroundColor:'rgba(79,70,229,.8)', borderRadius:4}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}});
}

load();
setInterval(() => { if (!document.hidden && !$('modal').offsetParent) load(); }, 60000);
</script>
</body>
</html>
